{{- if and .Values.ingress.enabled (not (and .Values.openshift .Values.route.enabled)) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hub.fullname" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Same origin: /api/* to the API service, everything else to the web service.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "hub.fullname" . }}-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hub.fullname" . }}-web
                port: { name: http }
{{- end }}

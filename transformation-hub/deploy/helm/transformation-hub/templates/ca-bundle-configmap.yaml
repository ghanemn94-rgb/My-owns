{{- if and .Values.customCA.enabled (not .Values.customCA.configMapName) }}
{{- if not (and .Values.openshift .Values.customCA.openshiftInjectTrustedBundle) }}
{{- fail "customCA.enabled needs customCA.configMapName (an existing ConfigMap) or, on OpenShift, customCA.openshiftInjectTrustedBundle=true" }}
{{- end }}
# OpenShift injects the cluster-wide trusted CA bundle (proxy/trustedCA configuration) into this ConfigMap.
# Created as an early hook so the migration Job can mount it on the very first install.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hub.fullname" . }}-trusted-ca
  labels:
    {{- include "hub.labels" . | nindent 4 }}
    config.openshift.io/inject-trusted-cabundle: "true"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
{{- end }}

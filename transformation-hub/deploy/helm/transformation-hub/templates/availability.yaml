{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "api" "web" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hub.fullname" $ }}-{{ $component }}
  labels:
    {{- include "hub.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  maxUnavailable: {{ $.Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "hub.selector" (dict "ctx" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
{{- range $component := list "api" "web" }}
{{- $hpa := index $.Values.autoscaling $component }}
{{- if $hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hub.fullname" $ }}-{{ $component }}
  labels:
    {{- include "hub.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hub.fullname" $ }}-{{ $component }}
  minReplicas: {{ $hpa.minReplicas }}
  maxReplicas: {{ $hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}

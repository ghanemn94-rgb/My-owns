apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hub.fullname" . }}-worker
  labels:
    {{- include "hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "hub.selector" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hub.podLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hub.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "hub.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "hub.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          env:
            {{- include "hub.appEnv" (dict "ctx" . "component" "worker") | nindent 12 }}
          # No HTTP port: liveness = PostgreSQL reachable with the runtime role (a heartbeat file is proposed —
          # docs/deployment/operations.md). The worker drains its in-flight iteration on SIGTERM.
          livenessProbe:
            exec:
              command: ["node", "/app/hub-entrypoint.cjs", "healthcheck", "worker"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.storage.driver "local" }}
            - name: objects
              mountPath: {{ .Values.storage.local.mountPath }}
            {{- end }}
            {{- if .Values.chromium.enabled }}
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
            {{- include "hub.caMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: {{ .Values.tmpSizeLimit }} }
        {{- if eq .Values.storage.driver "local" }}
        - name: objects
          persistentVolumeClaim:
            claimName: {{ .Values.storage.local.existingClaim }}
        {{- end }}
        {{- if .Values.chromium.enabled }}
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: {{ .Values.chromium.shmSizeLimit }} }
        {{- end }}
        {{- include "hub.caVolume" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

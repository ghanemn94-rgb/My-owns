# =====================================================================================================================
# Transformation Hub — Docker Compose for DEVELOPMENT / EVALUATION ONLY.
#
#   NOT FOR PRODUCTION. Single host, no high availability, no backups, local passwords in deploy/compose/.env,
#   local-filesystem object storage. Production uses the Helm chart (deploy/helm/transformation-hub) with secret
#   references, S3-compatible storage, OIDC and Mobily-managed PostgreSQL (docs/deployment/installation.md).
#
#   cp deploy/compose/.env.example deploy/compose/.env        # then replace every CHANGE_ME value
#   docker compose -f deploy/compose/compose.dev.yml --env-file deploy/compose/.env up -d --build
#   docker compose -f deploy/compose/compose.dev.yml --env-file deploy/compose/.env --profile demo run --rm seed-demo
#   open http://127.0.0.1:3000                                   # Demo sandbox (HUB_MODE=demo)
#   Optional MinIO (S3-compatible) for evaluating the S3 adapter/backup tooling:  --profile s3
#
# Networks: `backend` is internal (no route outside the host bridge): db, migrations, worker and MinIO have NO
# outbound internet access. `edge` carries the published ports (web, api) bound to 127.0.0.1 only.
# NOT EXECUTED in the build environment (no Docker daemon); validated with `docker compose config`.
# =====================================================================================================================
name: transformation-hub-dev

x-hardening: &hardening
  read_only: true
  user: "10001:0"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=256m,mode=1777"]

x-api-build: &api-build
  context: ../..
  dockerfile: apps/api/Dockerfile
  target: api
  args:
    NODE_BASE: ${HUB_NODE_BASE:-node:22.22.2-bookworm-slim}

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  HUB_MODE: ${HUB_MODE:-demo}
  HUB_ORG_SLUG: ${HUB_ORG_SLUG:-mobily}
  HUB_LOG_LEVEL: ${HUB_LOG_LEVEL:-info}
  HUB_PRIVATE_MODE: ${HUB_PRIVATE_MODE:-true}
  HUB_EGRESS_ALLOWLIST: ${HUB_EGRESS_ALLOWLIST:-}
  HUB_AI_ALLOW_MOCK: ${HUB_AI_ALLOW_MOCK:-true}
  HUB_COOKIE_SECURE: "false"            # plain http on 127.0.0.1 in dev; production requires true
  HUB_TRUST_PROXY: "true"               # requests arrive through the web container's /api rewrite (one proxy hop)
  HUB_STORAGE_DRIVER: local
  HUB_STORAGE_LOCAL_DIR: /data/objects
  HUB_OIDC_ISSUER: ${HUB_OIDC_ISSUER:-}
  HUB_OIDC_CLIENT_ID: ${HUB_OIDC_CLIENT_ID:-}
  HUB_OIDC_CLIENT_SECRET: ${HUB_OIDC_CLIENT_SECRET:-}
  HUB_OIDC_REDIRECT_URI: ${HUB_OIDC_REDIRECT_URI:-}
  DATABASE_URL: postgres://hub_app:${HUB_APP_DB_PASSWORD:?set HUB_APP_DB_PASSWORD in .env}@db:5432/${HUB_DB_NAME:-hub}
  NEXT_TELEMETRY_DISABLED: "1"

services:
  db:
    image: ${HUB_POSTGRES_IMAGE:-postgres:16.10-bookworm}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      HUB_OWNER_DB_PASSWORD: ${HUB_OWNER_DB_PASSWORD:?set HUB_OWNER_DB_PASSWORD in .env}
      HUB_APP_DB_PASSWORD: ${HUB_APP_DB_PASSWORD:?set HUB_APP_DB_PASSWORD in .env}
      HUB_DATABASES: ${HUB_DB_NAME:-hub}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb/10-hub-roles.sh:/docker-entrypoint-initdb.d/10-hub-roles.sh:ro
      - ../../scripts/ops/db-init-roles.sh:/hub-ops/db-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${HUB_DB_NAME:-hub}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
    restart: unless-stopped

  migrate:
    image: ${HUB_API_IMAGE:-transformation-hub/api:dev}
    build: *api-build
    command: ["migrate"]
    environment:
      DATABASE_MIGRATION_URL: postgres://hub_owner:${HUB_OWNER_DB_PASSWORD:?set HUB_OWNER_DB_PASSWORD in .env}@db:5432/${HUB_DB_NAME:-hub}
      DATABASE_URL: postgres://hub_app:${HUB_APP_DB_PASSWORD:?set HUB_APP_DB_PASSWORD in .env}@db:5432/${HUB_DB_NAME:-hub}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    restart: "no"
    <<: *hardening

  seed-demo:
    profiles: ["demo"]
    image: ${HUB_API_IMAGE:-transformation-hub/api:dev}
    command: ["seed-demo"]
    environment:
      <<: *app-env
      HUB_MODE: demo
      NODE_ENV: development
      DATABASE_MIGRATION_URL: postgres://hub_owner:${HUB_OWNER_DB_PASSWORD:?set HUB_OWNER_DB_PASSWORD in .env}@db:5432/${HUB_DB_NAME:-hub}
    volumes: ["objects:/data/objects"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    restart: "no"
    <<: *hardening

  api:
    image: ${HUB_API_IMAGE:-transformation-hub/api:dev}
    build: *api-build
    command: ["api"]
    environment: *app-env
    volumes: ["objects:/data/objects"]
    ports: ["127.0.0.1:${HUB_API_PORT:-4000}:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, edge]
    restart: unless-stopped
    <<: *hardening

  worker:
    image: ${HUB_API_IMAGE:-transformation-hub/api:dev}
    command: ["worker"]
    environment: *app-env
    volumes: ["objects:/data/objects"]
    healthcheck:
      test: ["CMD", "node", "/app/hub-entrypoint.cjs", "healthcheck", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    restart: unless-stopped
    <<: *hardening

  web:
    image: ${HUB_WEB_IMAGE:-transformation-hub/web:dev}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_BASE: ${HUB_NODE_BASE:-node:22.22.2-bookworm-slim}
        HUB_API_URL: http://api:4000      # fixed at build time by Next.js (routes manifest)
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports: ["127.0.0.1:${HUB_WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    restart: unless-stopped
    read_only: true
    user: "10001:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=256m,mode=1777

  minio:
    profiles: ["s3"]
    image: ${HUB_MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_BROWSER_REDIRECT: "false"
      MINIO_UPDATE: "off"                   # no update checks (private mode)
    volumes: ["miniodata:/data"]
    ports: ["127.0.0.1:9001:9001"]          # console only; the S3 API stays on the internal network
    networks: [backend, edge]
    restart: unless-stopped

  minio-init:
    profiles: ["s3"]
    image: ${HUB_MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 30); do mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && break; sleep 2; done &&
        mc mb --ignore-existing "local/$$HUB_S3_BUCKET" &&
        mc anonymous set none "local/$$HUB_S3_BUCKET" &&
        mc version enable "local/$$HUB_S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      HUB_S3_BUCKET: ${HUB_S3_BUCKET:-hub-objects}
    depends_on: [minio]
    networks: [backend]
    restart: "no"

networks:
  backend:
    internal: true
  edge: {}

volumes:
  pgdata: {}
  objects: {}
  miniodata: {}

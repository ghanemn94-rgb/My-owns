# Requirement register — Mobily Transformation & Transactions Hub
#
# Source: docs/MASTER_PROMPT.md (implementation specification, v1.0). Master prompt rule 1.2: every requirement
# has a Requirement ID, user story, implementation module and acceptance test; nothing is silently omitted.
# Owner: delivery-orchestrator. Requirements are never deleted — mark them Blocked or Deferred with owner/reason.
#
# Field conventions
#   id                REQ-<AREA>-<NNN>. AREA: PLT platform/execution rules, SRC sources, LCY lifecycle/gates/status
#                     dimensions, GOV committee/decisions, ENT enterprise structure/templates, WS workstreams/WBS,
#                     PER perimeter/transfers, AGR agreements/consents/approvals, TSA, RDY Day-1/cutover readiness,
#                     FIN finance/business plan/benefits, JV partner/DD/closing, PLN planning/RAID/change/measurement,
#                     UX screens/i18n/accessibility, RPT reporting/KPIs/snapshots, AI runtime AI PM, ARC architecture,
#                     DAT data model/integrity/API, SEC authorization/security, DEP hosting/deployment,
#                     INT imports/integrations, AGT Claude Code agents/process, PHS phases/gates/delivery artifacts,
#                     SET initial data/setup wizard.
#   section           Master prompt section. "1-R5" = section 1 mandatory rule 5; "9-M3" = section 9 measurement rule 3.
#   priority          must = stated as mandatory by the master prompt; should/could = desirable or optional.
#   ui                Screen names from master prompt section 10 (16 screens); [] when none.
#   api               PROPOSED endpoints. Project routes are /api/v1/projects/{projectId}/...;
#                     status changes are explicit domain commands (POST .../{id}/<verb>), never generic PATCH.
#   entities          Section 14 entities plus additional ones proposed for the ERD (e.g. Waiver, PartnerRoom,
#                     RecordVersion, Session, OutboxEvent, Job, Escalation, Recusal, StatusDimension, Source,
#                     GateCriterion, CommitteeCharterVersion, Minutes, MeetingPack, ImportBatch, KnowledgeChunk,
#                     AIPolicy, WorkingCalendar, RagOverride, ProgressUpdate, Signing, Closing, NegotiationIssue,
#                     LegalHold, RetentionPolicy, ExportFile, WebhookDelivery, User).
#   acceptance_tests  AT-xx = master prompt section 20 scenario. Proposed tests are prefixed:
#                     UT unit, IT integration (real PostgreSQL), E2E Playwright, EVAL AI evaluation set,
#                     VIS human/visual check, REVIEW document/independent-review check.
#   phase             Software delivery phase P0..P8 (section 19) in which the requirement must be verified.
#   status            Planned | Implemented | Tested | Simulated | Not configured | Blocked | Deferred.
#                     Only evidence actually produced (command + result, review file + revision) may be added.
#   evidence          Paths/commands/review reports proving status. Empty until real evidence exists.
#
# Nothing in this file is a Mobily fact. Roles are functional ("Role — To be confirmed" where a person is needed).



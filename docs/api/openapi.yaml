    Decimal:
      type: string
      pattern: "^-?[0-9]{1,18}(\\.[0-9]{1,6})?$"
      description: Exact decimal as a string (numeric in PostgreSQL, decimal.js in TypeScript). Never a JSON number, never a float (ADR-0003, ADR-0019).
      examples: ["1250000.00"]
    BusinessDate:
      type: string
      format: date
      description: Calendar date `YYYY-MM-DD` (PostgreSQL `date`), interpreted in the transformation's time zone (default Asia/Riyadh). An impossible date (2026-02-30) is 400.
    GateCode:
      type: string
      description: Product gate G1-G6 (business approval inside the product). NOT an engineering delivery gate (DG0-DG7).
      enum: [G1, G2, G3, G4, G5, G6]

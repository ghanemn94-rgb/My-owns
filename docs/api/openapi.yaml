              schema: { $ref: "#/components/schemas/GateSubmissionPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [gates]
      operationId: submitGate
      summary: "Submit the gate for decision (gate.submit). Creates submission N+1 with an immutable snapshot of the required outputs and evidence; a pending earlier submission becomes `superseded`."
      description: |
        Refused with 422 `gate_criteria_incomplete` (problem `errors[]` lists each incomplete mandatory criterion) when any
        mandatory criterion is incomplete. G1 needs the diagnostic, a baseline, root causes, value pools and an initial
        charter: a submission without an initial charter is rejected. Evidence that is only a filename or an inaccessible
        link is unverified and leaves a criterion that requires verified evidence incomplete (REQ-S13-012).
        Needs the gate's If-Match (its version), so two concurrent submissions cannot both win.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GateSubmissionCreate" }
      responses:
        "201":
          description: "Submitted."
          headers:
            Location: { $ref: "#/components/headers/Location" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateSubmission" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/BusinessRule" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/v1/transformations/{transformationId}/gates/{gateCode}/submissions/{submissionNo}:
    parameters:
      - $ref: "#/components/parameters/TransformationId"
      - $ref: "#/components/parameters/GateCode"
      - $ref: "#/components/parameters/SubmissionNo"
    get:
      tags: [gates]
      operationId: getGateSubmission
      summary: "One submission with its frozen criteria and snapshot."
      responses:
        "200":
          description: "The submission."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateSubmissionView" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/transformations/{transformationId}/gates/{gateCode}/decision:
    parameters:
      - $ref: "#/components/parameters/TransformationId"
      - $ref: "#/components/parameters/GateCode"
    post:
      tags: [gates]
      operationId: decideGate
      summary: "Record the business decision on the current submission: approved / rejected / changes_requested / deferred, with a mandatory rationale."
      description: |
        Authorization (ADR-0015):
        - The caller must be the configured approver: the named approver user if one is configured, otherwise a holder of
          the configured approver role (default SP) with `gate.decide` on the transformation, or their delegate acting on
          their behalf. Anyone else gets **403** `gate.not_approver`.
        - The submitter (or someone acting on the submitter's behalf) gets **403** `gate.submitter_cannot_decide`.
        - `submissionNo` must be the current pending submission. A superseded, withdrawn or already decided submission gives
          **409** (`urn:mth:problem:version-conflict`, code `gate.submission_superseded`, `currentVersion` = the current
          submission number). Nothing is written.
        The decision writes a canonical `decision` row (kind `gate`, code GD-nn) and its `gate_decision` record (approver
        basis, submission number, rationale, timestamp) in one transaction. Approval of G1/G2/G3 advances the
        transformation's current phase to the gate's next phase. An engineering agent or seed data never grants a real
        approval; G-gate approvals never imply DG0-DG7.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GateDecisionCreate" }
      responses:
        "201":
          description: "Decision recorded."
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateDecision" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/BusinessRule" }
  /api/v1/transformations/{transformationId}/evidence/{evidenceId}/content:

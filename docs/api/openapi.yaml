        submissionEnabled: { type: boolean, description: "P2: true for G1-G3 only." }
        canSubmit: { type: boolean, description: "The caller holds gate.submit and every mandatory criterion is complete." }
        canDecide: { type: boolean, description: "The caller is the configured approver and not the submitter of the pending submission." }
    GateList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, minItems: 6, maxItems: 6, items: { $ref: "#/components/schemas/GateView" } }
    GateApproverConfig:
      type: object
      required: [approverRoleCode]
      additionalProperties: false
      properties:
        approverRoleCode: { $ref: "#/components/schemas/RoleCode" }
        approverUserId: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
    GateSubmissionCreate:
      type: object
      additionalProperties: false
      properties:
        submissionNote: { type: string, minLength: 1, maxLength: 4000 }
        dueDate: { $ref: "#/components/schemas/BusinessDate" }
    GateSubmissionView:
      type: object
      required: [submission, criteria, decision]
      additionalProperties: false
      properties:
        submission: { $ref: "#/components/schemas/GateSubmission" }
        criteria: { type: array, items: { $ref: "#/components/schemas/GateSubmissionCriterion" } }
        decision: { oneOf: [{ $ref: "#/components/schemas/GateDecision" }, { type: "null" }] }
    GateDecisionCreate:
      type: object
      required: [submissionNo, outcome, rationale]
      additionalProperties: false
      properties:
        submissionNo: { type: integer, minimum: 1, description: "Must be the current pending submission; otherwise 409." }
        outcome: { type: string, enum: [approved, rejected, changes_requested, deferred] }
        rationale: { type: string, minLength: 3, maxLength: 8000 }
        comments: { type: string, minLength: 1, maxLength: 8000 }
        onBehalfOfUserId: { $ref: "#/components/schemas/Uuid" }
    EvidenceReview:
      type: object
      required: [result, accessibilityStatus, note]
      additionalProperties: false
      properties:
        result: { type: string, enum: [verified, rejected] }
        accessibilityStatus: { type: string, enum: [accessible, inaccessible], description: "The reviewer confirms the content was opened. `verified` needs `accessible`." }
        note: { type: string, minLength: 1, maxLength: 2000 }
    EvidenceLinkCreate:
      type: object
      required: [evidenceId, recordType, recordId]
      additionalProperties: false
      properties:
        evidenceId: { $ref: "#/components/schemas/Uuid" }
        recordType: { $ref: "#/components/schemas/LinkableRecordType" }
        recordId: { $ref: "#/components/schemas/Uuid" }
    GateSubmissionPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GateSubmission" } }
        nextCursor: { type: [string, "null"] }
    EvidenceLinkPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EvidenceLink" } }
        nextCursor: { type: [string, "null"] }
    TeamAssignment:
      type: object
      required: [assignment, accountability, inherited]
      additionalProperties: false
      properties:
        assignment: { $ref: "#/components/schemas/RoleAssignment" }
        accountability: { oneOf: [{ $ref: "#/components/schemas/RoleAccountability" }, { type: "null" }] }
        inherited: { type: boolean, description: "Granted at a wider scope (business unit / organization) and inherited downward." }
    TeamAssignmentPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TeamAssignment" } }
        nextCursor: { type: [string, "null"] }
    TeamAssignmentCreate:
      type: object
      required: [userId, roleCode, reason]
      additionalProperties: false
      properties:
        userId: { $ref: "#/components/schemas/Uuid" }
        roleCode: { type: string, enum: [WL, KDS, TD, CM, SEC], description: "Team roles without any gate, finance or target approval and without assignment rights (ADR-0020). SP, BO, FIN, TL, TO, AUD and admin roles need access.assign via /api/v1/role-assignments." }
        effectiveFrom: { $ref: "#/components/schemas/Timestamp" }
        effectiveTo: { $ref: "#/components/schemas/Timestamp" }
        reason: { $ref: "#/components/schemas/Reason" }

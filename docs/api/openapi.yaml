      description: |
        Product gates G1-G6 are business approvals inside the product (playbook B0023). They are unrelated to the
        engineering delivery gates DG0-DG7: no product gate decision implies any engineering gate, and the reverse.
        P2 enables submission for G1, G2 and G3; G4-G6 answer 422 `gate_not_enabled` until their stage.
      responses:
        "200":
          description: "G1-G6 in order."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/transformations/{transformationId}/gates/{gateCode}:
    parameters:
      - $ref: "#/components/parameters/TransformationId"
      - $ref: "#/components/parameters/GateCode"
    get:
      tags: [gates]
      operationId: getGate
      summary: "One gate: definition, configured approver, current submission and the LIVE evaluation of every required output (criterion) with its evidence state."
      description: |
        Product gates G1-G6 are business approvals inside the product (playbook B0023). They are unrelated to the
        engineering delivery gates DG0-DG7: no product gate decision implies any engineering gate, and the reverse.
        P2 enables submission for G1, G2 and G3; G4-G6 answer 422 `gate_not_enabled` until their stage.
      responses:

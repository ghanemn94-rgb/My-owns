# =====================================================================================================================
# Transformation Hub CI (the repository also contains an unrelated trading_agent/ — this workflow only runs for
# transformation-hub/). Jobs: static checks, unit tests, template validator, integration tests (PostgreSQL 16 service),
# OpenAPI, web build + private-mode egress check, Playwright smoke, backup/restore drill, deployment validation
# (helm/kubeconform/compose/shellcheck), container images + image SBOM + vulnerability report, source SBOM
# (syft / CycloneDX), pnpm audit (report only), licence policy check, Docker Compose dev/eval stack (documented
# commands, up --wait, smoke, down -v) and secret scan (gitleaks: history + tree, web bundle, CI test reports).
# Supply chain: pin every action to a full commit SHA when mirroring this workflow into Mobily's CI (tags are used here
# because SHAs could not be verified in the build environment). Images are built but never pushed from this workflow.
# Downloaded tools are pinned by version and verified by SHA-256 (gitleaks) where the job installs them itself.
# Artifacts under hidden directories (.dev/, .next/) need `include-hidden-files: true` (actions/upload-artifact >= 4.4).
# =====================================================================================================================
name: transformation-hub-ci

on:
  push:
    branches: [main, "claude/**"]
    paths: ["transformation-hub/**", ".github/workflows/transformation-hub-ci.yml"]
  pull_request:
    paths: ["transformation-hub/**", ".github/workflows/transformation-hub-ci.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release mode: licence review items without a recorded approval fail the build"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: transformation-hub
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PNPM_VERSION: 10.33.0
  NODE_VERSION: "22"
  # Throwaway credentials of the CI-only PostgreSQL service container (never used anywhere else).
  PGADMIN_URL: postgres://postgres:ci_only_postgres@127.0.0.1:5432/postgres
  HUB_DEV_DB_PASSWORD: hub_dev_only

jobs:
  static:
    name: Install, build packages, typecheck, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: transformation-hub/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      # No separate build step: the documented commands must work on a fresh checkout (QA-P1-08) — they build the
      # workspace packages (dist/ types) themselves.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y -qq python3-yaml
      - run: python3 scripts/requirements/apply_status.py --check

  unit:
    name: Domain/contract unit tests + template validator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: transformation-hub/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm --filter @hub/db run validate:templates

  integration:
    name: API integration tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci_only_postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: transformation-hub/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Create roles hub_owner / hub_app (NOBYPASSRLS) and the test database
        run: HUB_OWNER_DB_PASSWORD="$HUB_DEV_DB_PASSWORD" HUB_APP_DB_PASSWORD="$HUB_DEV_DB_PASSWORD" HUB_DATABASES="hub_test hub_test_boot" bash scripts/ops/db-init-roles.sh
      - run: pnpm build:packages
      - run: pnpm --filter @hub/api test

  openapi:
    name: OpenAPI generation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: transformation-hub/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages && pnpm --filter @hub/api run build
      - run: node apps/api/dist/cli/openapi.js openapi.json
      - uses: actions/upload-artifact@v4
        with: { name: openapi, path: transformation-hub/openapi.json }

  web:
    name: Web build + private-mode egress check (AT-22)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: transformation-hub/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages && pnpm --filter @hub/api run build
      - run: pnpm --filter @hub/web run build
        env: { HUB_API_URL: "http://hub-api:4000" }
      - name: Scan built assets for external URLs (fonts/CDNs/telemetry)
        run: bash scripts/ops/egress-check.sh --require-web --allow hub-api | tee egress-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: egress-report, path: transformation-hub/egress-report.txt }
      # The client bundle served to browsers; the secret-scan job scans exactly this artifact (REQ-ARC-015 / REQ-SEC-012).
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: transformation-hub/apps/web/.next/static
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Playwright smoke (demo stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # the full suite (~400 tests incl. the axe scans of every screen) runs ~30 min on a hosted runner
    needs: [static]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci_only_postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://hub_app:hub_dev_only@127.0.0.1:5432/hub_e2e
      DATABASE_MIGRATION_URL: postgres://hub_owner:hub_dev_only@127.0.0.1:5432/hub_e2e
      HUB_MODE: demo
      NODE_ENV: development
      HUB_STORAGE_LOCAL_DIR: /tmp/hub-e2e-objects
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: transformation-hub/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: HUB_OWNER_DB_PASSWORD="$HUB_DEV_DB_PASSWORD" HUB_APP_DB_PASSWORD="$HUB_DEV_DB_PASSWORD" HUB_DATABASES=hub_e2e bash scripts/ops/db-init-roles.sh
      - run: pnpm build:packages && pnpm --filter @hub/api run build
      - name: Migrate (container entrypoint command) and load the Demo sandbox
        run: |
          node deploy/docker/api-entrypoint.cjs migrate
          node apps/api/dist/cli/seed-demo.js
      - name: Start API and worker
        # Every browser shares the public-route rate-limit bucket behind the web tier's same-origin /api rewrite, and the
        # suite signs in many times a minute (e2e/playwright.config.ts) — raise that limit for this dev/test stack only.
        run: |
          mkdir -p .dev
          HUB_RATE_LIMIT_PUBLIC_PER_MINUTE=1000 nohup node apps/api/dist/main.js > .dev/api.log 2>&1 &
          nohup node apps/api/dist/worker.js > .dev/worker.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:4000/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:4000/readyz
      - name: Build and start the web app (production build; next dev compiles each page on first hit)
        # `next build` must not run with NODE_ENV=development (set for the API above); HUB_API_URL is read at build time.
        run: |
          env -u NODE_ENV HUB_API_URL=http://127.0.0.1:4000 pnpm --filter @hub/web run build
          env -u NODE_ENV nohup pnpm --filter @hub/web run start > .dev/web.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:3000/login >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/login >/dev/null
      - run: pnpm --filter @hub/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          # .dev/ is a hidden directory: without include-hidden-files the api/worker/web logs are silently left out.
          include-hidden-files: true
          path: |
            transformation-hub/e2e/playwright-report
            transformation-hub/e2e/test-results
            transformation-hub/.dev/*.log

  restore-drill:
    name: Backup/restore drill (AT-23)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci_only_postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: transformation-hub/pnpm-lock.yaml }
      - name: PostgreSQL 16 client tools (pg_dump must not be older than the server)
        run: |
          if ! pg_dump --version 2>/dev/null | grep -q ' 16\.'; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
            echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages && pnpm --filter @hub/api run build
      - run: HUB_DRILL_DIR="$PWD/.dev/drill" bash scripts/ops/restore-drill.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-drill
          include-hidden-files: true   # everything lives under .dev/ (hidden); otherwise nothing is uploaded
          path: |
            transformation-hub/.dev/drill/*/drill.log
            transformation-hub/.dev/drill/*/restore-report.txt
            transformation-hub/.dev/drill/*/backup/manifest.json

  deploy-validate:
    name: Helm / kubeconform / compose / shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.19.0 }
      - name: kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
      - run: KUBECONFORM=/tmp/kubeconform bash scripts/ops/validate-deploy.sh

  compose:
    # REQ-DEP-002 / REQ-DEP-007. Docker Compose is for DEVELOPMENT / EVALUATION ONLY: one host, one container per service,
    # NO HIGH AVAILABILITY, no backups, local throwaway passwords. Production uses the Helm chart.
    # This job runs the DOCUMENTED commands (docs/deployment/installation.md §7, deploy/compose/compose.dev.yml header)
    # from a clean checkout: images are built locally in the job and never pushed; only the base images and npm packages
    # are pulled; the running stack calls no external service (the backend network is internal).
    name: Docker Compose dev/eval stack (documented commands, up --wait, smoke, down -v; no HA)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose is for development/evaluation only (no high availability)
        run: |
          echo "::notice title=Docker Compose = development/evaluation only::Single host, one container per service, no high availability, no backups, local throwaway passwords. Production uses the Helm chart (docs/deployment/installation.md)."
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version
      - name: "Documented: create deploy/compose/.env (CHANGE_ME -> random local-only values, never printed)"
        run: |
          bash scripts/ops/compose-env-init.sh
          # Defence in depth: mask the generated throwaway values in the log (they are not printed anywhere).
          grep -E '^(POSTGRES_PASSWORD|HUB_OWNER_DB_PASSWORD|HUB_APP_DB_PASSWORD|MINIO_ROOT_USER|MINIO_ROOT_PASSWORD)=' deploy/compose/.env \
            | cut -d= -f2- | sed 's/^/::add-mask::/'
      - name: "Documented: docker compose up --build --wait (healthy db, api, worker, web; migrate exited 0)"
        run: docker compose -f deploy/compose/compose.dev.yml --env-file deploy/compose/.env up --build --wait --wait-timeout 300
      - name: "Documented: load the Demo sandbox"
        run: docker compose -f deploy/compose/compose.dev.yml --env-file deploy/compose/.env --profile demo run --rm seed-demo
      - name: "Documented: smoke checks (API readyz, web login, demo login + authenticated API calls via the web origin, worker heartbeat)"
        run: |
          mkdir -p "$RUNNER_TEMP/compose-smoke"
          bash scripts/ops/compose-smoke.sh | tee "$RUNNER_TEMP/compose-smoke/smoke.txt"
      - name: Collect container state and logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/compose-smoke"
          docker compose -f deploy/compose/compose.dev.yml --env-file deploy/compose/.env ps -a > "$RUNNER_TEMP/compose-smoke/ps.txt" 2>&1 || true
          docker compose -f deploy/compose/compose.dev.yml --env-file deploy/compose/.env logs --no-color --timestamps > "$RUNNER_TEMP/compose-smoke/logs.txt" 2>&1 || true
      - name: On failure, print container state, health-probe output and recent logs
        if: failure()
        run: |
          C="docker compose -f deploy/compose/compose.dev.yml --env-file deploy/compose/.env"
          $C ps -a || true
          for id in $($C ps -aq); do
            echo "== $(docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}' "$id")"
            docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}probe exit={{.ExitCode}} {{.Output}}{{end}}{{end}}' "$id" | tail -n 20 || true
          done
          for s in migrate api worker web; do echo "== logs: $s"; $C logs --no-color --tail 80 "$s" || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compose-smoke, path: "${{ runner.temp }}/compose-smoke", if-no-files-found: warn }
      - name: "Documented: docker compose down -v (removes containers, networks and volumes)"
        if: always()
        run: docker compose -f deploy/compose/compose.dev.yml --env-file deploy/compose/.env down -v

  secret-scan:
    # REQ-SEC-012 / REQ-ARC-015 / REQ-SET-008: no secrets in (a) the repository history and tree, (b) the built web client
    # bundle, (c) the test reports and logs produced by this workflow (Playwright report and traces, api/worker/web logs,
    # restore-drill and compose logs) or the committed test evidence. Scanner: gitleaks (MIT), pinned version, SHA-256
    # verified; rules and the allow-list policy (synthetic dev/CI values only) in scripts/ops/gitleaks.toml. Any other
    # finding fails the job. Runs after the producing jobs, also when one of them failed (failed runs keep traces).
    name: Secret scan (gitleaks — history + tree, web bundle, CI test reports)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [web, e2e, restore-drill, compose]
    if: ${{ !cancelled() }}
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (release checksums file, verified in the build environment 2026-09-30)
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history of this revision
      - name: Install gitleaks (pinned release, SHA-256 verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
          echo "SECRET_SCAN_REPORT_DIR=$RUNNER_TEMP/secret-scan" >> "$GITHUB_ENV"
      - name: (a) repository history — every commit reachable from this revision
        run: bash scripts/ops/secret-scan.sh history
      - name: (a) repository tree at this revision
        if: ${{ !cancelled() }}
        run: bash scripts/ops/secret-scan.sh tree
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: ${{ needs.web.result != 'success' }}
        with: { name: web-bundle, path: "${{ runner.temp }}/scan/web-bundle" }
      - name: (b) built web client bundle (apps/web/.next/static)
        if: ${{ !cancelled() }}
        run: bash scripts/ops/secret-scan.sh bundle "$RUNNER_TEMP/scan/web-bundle"
      # Report artifacts: a download may only be missing when its producing job failed (then that job is already red).
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: ${{ needs.e2e.result != 'success' }}
        with: { name: e2e-report, path: "${{ runner.temp }}/scan/reports/e2e-report" }
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: ${{ needs.restore-drill.result != 'success' }}
        with: { name: restore-drill, path: "${{ runner.temp }}/scan/reports/restore-drill" }
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: ${{ needs.compose.result != 'success' }}
        with: { name: compose-smoke, path: "${{ runner.temp }}/scan/reports/compose-smoke" }
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: ${{ needs.web.result != 'success' }}
        with: { name: egress-report, path: "${{ runner.temp }}/scan/reports/egress-report" }
      - name: (c) CI test reports and logs + committed test evidence
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/scan/reports/*)
          bash scripts/ops/secret-scan.sh reports "${reports[@]}" docs/test-evidence
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: secret-scan-report, path: "${{ runner.temp }}/secret-scan", if-no-files-found: warn }

  images:
    name: Container images (build only) + image SBOM + vulnerability report
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (target api)
        # CI uses the public base image by TAG only; release builds in Mobily's pipeline pass the mirrored image digest.
        run: >-
          docker build -f apps/api/Dockerfile --target api
          --build-arg NODE_BASE=node:22.22.2-bookworm-slim
          --build-arg APP_VERSION=ci --build-arg GIT_COMMIT="${GITHUB_SHA}"
          -t transformation-hub/api:ci --load .
      - name: Build web image
        run: >-
          docker build -f apps/web/Dockerfile
          --build-arg NODE_BASE=node:22.22.2-bookworm-slim --build-arg HUB_API_URL=http://hub-api:4000
          --build-arg APP_VERSION=ci --build-arg GIT_COMMIT="${GITHUB_SHA}"
          -t transformation-hub/web:ci --load .
      - name: Image smoke checks (non-root user, entrypoint, no npm in runtime image)
        run: |
          test "$(docker inspect -f '{{.Config.User}}' transformation-hub/api:ci)" = "10001:0"
          test "$(docker inspect -f '{{.Config.User}}' transformation-hub/web:ci)" = "10001:0"
          docker run --rm --read-only transformation-hub/api:ci help
          ! docker run --rm --entrypoint node transformation-hub/api:ci -e "require.resolve('/usr/local/lib/node_modules/npm')"
      - uses: anchore/sbom-action@v0
        with: { image: "transformation-hub/api:ci", format: cyclonedx-json, output-file: sbom-api-image.cdx.json, artifact-name: sbom-api-image.cdx.json }
      - uses: anchore/sbom-action@v0
        with: { image: "transformation-hub/web:ci", format: cyclonedx-json, output-file: sbom-web-image.cdx.json, artifact-name: sbom-web-image.cdx.json }
      - name: Vulnerability report (grype) — report only; triage per docs/deployment/supply-chain.md
        uses: anchore/scan-action@v6
        id: scan
        with: { image: "transformation-hub/api:ci", fail-build: false, severity-cutoff: critical, output-format: json, output-file: vulnerability-report-api.json }
      - uses: actions/upload-artifact@v4
        if: always()
        # explicit file (the action's `json` output is not always set) — CI run 2 failed on an empty `path`
        with: { name: vulnerability-report-api, path: vulnerability-report-api.json, if-no-files-found: warn }

  sbom:
    name: Source SBOM (syft, CycloneDX)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: transformation-hub
          format: cyclonedx-json
          output-file: transformation-hub-source.cdx.json
          artifact-name: transformation-hub-source.cdx.json

  audit:
    name: pnpm audit --prod (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: transformation-hub/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --json > pnpm-audit.json || true
      - run: pnpm audit --prod || true
      - uses: actions/upload-artifact@v4
        with: { name: pnpm-audit, path: transformation-hub/pnpm-audit.json }

  licences:
    name: Licence policy (shipped dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: transformation-hub/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Check licences against scripts/ops/licence-policy.json
        env:
          RELEASE_MODE: ${{ inputs.release && '--release' || '' }}
        run: node scripts/ops/licence-check.mjs ${RELEASE_MODE:+"$RELEASE_MODE"} --report licence-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: licence-report, path: transformation-hub/licence-report.md }

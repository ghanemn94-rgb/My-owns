# CI job fragment of T-DG7-DO-B (ADR-0063 §1.5; REQ-S16-031 "a CI secret scan blocks committed secrets").
# The orchestrator merges it into deploy/ci/ci.yml and, verbatim, .github/workflows/ci.yml after DO-A's W2 change, then
# runs `node deploy/scripts/check-ci-needs.mjs` (p7-work-split §2 rule 9). Merge instructions:
#   1. insert the `secret-scan` job below (the entry under `jobs:`) directly after the `delivery-gates` job;
#   2. make every other job that today has `needs: delivery-gates` (verify, dependency-audit, release) also need
#      `secret-scan`: `needs: [delivery-gates, secret-scan]`. integration, e2e and images then depend on it transitively.
# No status-function `if:`, no dependency install (the scans and their self-tests use only Node built-ins and the
# repository's own files; claims-scan imports packages/shared/src/text-scan/claims.ts through Node 24 type stripping).
# fetch-depth: 0 because the history scope scans every blob reachable from HEAD. Live CI has not been run (D-058).
jobs:
  # devops-engineer (T-DG7-DO-B, ADR-0063 §1.5): the repository secret scan blocks committed secrets before any product
  # job runs. Payload (the candidate manifest of this commit, what the archive's source/ holds), then history (every
  # blob reachable from HEAD, except trading_agent/), then the self-tests (T-G1..T-G8, which also run the claims scan
  # over the docs and UI strings). Exit 1 (a hit or a stale allow-list entry) or 2 (BLOCKED) fails the job.
  secret-scan:
    needs: delivery-gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history scope scans every blob reachable from HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Secret scan, payload (the candidate manifest of this commit)
        run: node tools/release/secret-scan.mjs --scope payload
      - name: Secret scan, history (every blob reachable from HEAD)
        run: node tools/release/secret-scan.mjs --scope history
      - name: Secret-scan, claims-scan and controls-matrix self-tests (T-G1..T-G8)
        run: node --test tools/release/tests/secret-scan.test.mjs tools/release/tests/claims-scan.test.mjs tools/release/tests/security-controls.test.mjs
